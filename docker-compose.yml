
services:
  chall4:
    image: registry.momit.pluribus-one.it:8086/hackhathon/chall4:1.0.0
    container_name: chall4
    environment:
      PORT: "80"
    networks:
      - challs-network

  modsecurity:
    image: registry.momit.pluribus-one.it:8086/hackhathon/modsecurity:1.0.1
    container_name: modsecurity
    ports:
      - "80:8080"
    environment:
      SERVER_NAME: localhost
      PORT: "8080"
      BACKEND: http://chall4:80
      SEERBOX_GUI_BACKEND: http://sbx-gui
      IP_HOST_SB: sbx-engine
      PORT_SB: "20050"
      SEERBOX_RULE_FEED_FILE: /opt/seer_box/var/feeds/modsecurity_modsecurity
      SEERBOX_RULE_POLL_INTERVAL: "5"
      FIREWALL_NAME: modsecurity
      ANOMALY_INBOUND: "999999"
      MODSEC_RULE_ENGINE: "on"
      MODSEC_REQ_BODY_ACCESS: "on"
      MODSEC_RESP_BODY_ACCESS: "on"
    volumes:
      - seer-box-data:/opt/seer_box
    depends_on:
      chall4:
        condition: service_started
      sbx-engine:
        condition: service_started
      sbx-gui:
        condition: service_started
    networks:
      - challs-network
      - sbx-network

  sbx-queue:
    image: docker.io/rabbitmq:4.2
    container_name: seer_box_queue
    hostname: seer_box_queue
    environment:
      RABBITMQ_DEFAULT_USER: seer_box
      RABBITMQ_DEFAULT_PASS: seer_box
    volumes:
      - seer-box-queue:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks:
      - sbx-network

  sbx-storage:
    image: docker.io/postgres:15
    container_name: seer_box_storage
    environment:
      POSTGRES_USER: seer_box
      POSTGRES_DB: seer_box
      POSTGRES_PASSWORD: seer_box
    volumes:
      - seer-box-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seer_box -d seer_box"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks:
      - sbx-network

  sbx-engine:
    image: quay.io/pluribus_one/seer_box_engine:26.3
    container_name: seer_box_engine
    user: seer-box:seer-box
    volumes:
      - seer-box-data:/opt/seer_box:Z
      - ./seer_box_firewall/settings.toml:/opt/seer_box/setting.toml:ro
    networks:
      sbx-network:
        aliases:
          - sbx-engine
          - seer_box_engine
      challs-network:
        aliases:
          - sbx-engine
    environment:
      - SBX_DATABASE_HOSTNAME=seer_box_storage
      - SBX_QUEUE_HOSTNAME=seer_box_queue
      - SBX_SERVER_WEB_URL_HOST=seer_box_engine
      - SBX_DATABASE_PASSWORD=seer_box
      - SBX_QUEUE_PASSWORD=seer_box
      - SBX_ACCEPT_EULA=YES
    ports:
      - 20050-20100:20050-20100/udp
      - 20050-20100:20050-20100/tcp
    depends_on:
      sbx-queue:
        condition: service_healthy
      sbx-storage:
        condition: service_healthy

  sbx-gui:
    image: quay.io/pluribus_one/seer_box_gui:26.3
    container_name: seer_box_gui
    environment:
      SBX_API_HOST: seer_box_engine
      SBX_API_PORT: "4000"
      SBX_DNS_RESOLVER: "127.0.0.11"
    depends_on:
      sbx-engine:
        condition: service_started
    ports:
      - 53380:80
    networks:
      sbx-network:
        aliases:
          - seer_box_gui
          - sbx-gui

  seerbox-init:
    image: registry.momit.pluribus-one.it:8086/hackhathon/seerbox-init:1.0.0
    environment:
      SBX_ENGINE_URL: http://sbx-engine:4000
      API_USERNAME: admin
      API_PASSWORD: SeerBox_4dm1n
      TRAFFIC_SOURCE_NAME: nginx
      FIREWALL_NAME: modsecurity
      SEERBOX_TRAFFIC_PORT: "20050"
    depends_on:
      sbx-gui:
        condition: service_started
    volumes:
      - seer-box-data:/opt/seer_box
    restart: "no"
    networks:
      - sbx-network

volumes:
  seer-box-queue:
  seer-box-storage:
  seer-box-data:

networks:
  challs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/16

  sbx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.51.0.0/16
